<section class="cookie-banner" data-cookie-banner role="region" aria-label="Gestion des cookies" hidden>
  <div class="cookie-banner__inner">
    <p class="cookie-banner__title">🍪 Un petit cookie ?</p>
    <p>On utilise uniquement ce qui est nécessaire au fonctionnement du site (ton panier, ton choix de cookies). Avec ton accord, on pourrait aussi mesurer l'audience pour améliorer la boutique. <a href="/confidentialite.html#cookies">En savoir plus</a></p>

    <form class="cookie-banner__prefs" data-cookie-prefs hidden>
      <label class="switch">
        <input type="checkbox" checked disabled>
        <span><strong>Nécessaires</strong> : panier et mémorisation de ton choix (toujours actifs)</span>
      </label>
      <label class="switch">
        <input type="checkbox" name="analytics" data-cookie-analytics>
        <span><strong>Mesure d'audience</strong> : statistiques anonymes de visite</span>
      </label>
    </form>

    <div class="cookie-banner__actions">
      <button class="btn btn--outline btn--small" type="button" data-cookie-reject><span class="btn__label">Tout refuser</span></button>
      <button class="btn btn--outline btn--small" type="button" data-cookie-customize aria-expanded="false"><span class="btn__label">Personnaliser</span></button>
      <button class="btn btn--outline btn--small" type="button" data-cookie-save hidden><span class="btn__label">Enregistrer</span></button>
      <button class="btn btn--outline btn--small" type="button" data-cookie-accept><span class="btn__label">Tout accepter</span></button>
    </div>
  </div>
</section>

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# --- HTTPS forcé + domaine unique (remplace squishlandy.fr par ton domaine) ---
[[redirects]]
  from = "http://squishlandy.fr/*"
  to = "https://www.squishlandy.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.squishlandy.fr/*"
  to = "https://www.squishlandy.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://squishlandy.fr/*"
  to = "https://www.squishlandy.fr/:splat"
  status = 301
  force = true

# API de paiement (exécutée côté serveur, jamais dans le navigateur)
[[redirects]]
  from = "/api/checkout"
  to = "/.netlify/functions/checkout"
  status = 200

# --- En-têtes de sécurité ---
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"

# --- Cache (vitesse) : fichiers versionnés par Vite = cache 1 an ---
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
